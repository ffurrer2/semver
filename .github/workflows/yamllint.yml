name: yamllint

on:
  push:
    branches:
    - main
    paths:
    - '**.ya?ml'
  pull_request:
    branches:
    - main
    paths:
    - '**.ya?ml'

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    uses: ffurrer2/reusable-workflows/.github/workflows/yamllint.yml@49bcdb3a6519ac25da03b8c906226b824a168831 # v1.6.0
